version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: cinema-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cinema_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: cinema-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: cinema-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data: